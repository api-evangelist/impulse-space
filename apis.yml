aid: impulse-space
name: Impulse Space
description: >-
  Impulse Space is an American aerospace company founded in 2021 by Tom Mueller,
  building in-space transportation and mobility infrastructure. The company
  designs and operates orbital transfer vehicles (OTVs) that host, maneuver, and
  deliver payloads across and between orbits for commercial, civil, and
  government customers. Its product line includes Mira, an agile spacecraft for
  precise payload hosting and deployment across any orbit; Helios, a high-energy
  kick stage capable of moving up to 4,000 kg of payload from Low Earth Orbit to
  Geostationary Orbit in under 24 hours; and a GEO Rideshare program offering
  economical access to geostationary orbit. Impulse Space is a hardware and
  launch-services company rather than a software API provider, and does not
  publish a public developer portal, API, or SDKs. This profile was surfaced as
  a portfolio company of DCVC and Founders Fund and enriched from the company's
  public website.
